name: trigger house-alerts

# house-alerts is private and its own schedule has never fired: 0 schedule runs
# across every slot since 2026-11-08, while this account's public repos do run
# on schedule. This repo exists only to press the button, and holds no data.
on:
  schedule:
    # 08:17, 13:17, 20:17 Taipei. Must match the budget sum in the crawler's
    # test_crawl.py: adding a slot here adds a full 18-minute run over there.
    - cron: "17 0,5,12 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the crawl
        env:
          GH_TOKEN: ${{ secrets.HOUSE_ALERTS_TOKEN }}
        # Deliberately curl rather than `gh workflow run`: gh resolves the
        # default branch over GraphQL first, which needs Contents: read, and
        # this token is scoped to Actions: write alone. Naming the ref keeps
        # the token minimal. -f so a refused dispatch fails the step.
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/floraliu-dev/house-alerts/actions/workflows/crawl.yml/dispatches \
            -d '{"ref":"main"}'
